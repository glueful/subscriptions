name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Backs tests/Integration/Concurrency/PostgresSavepointTest.php (Task 15):
    # SQLite cannot exercise the poisoned-transaction failure mode
    # SubscriptionService::startFor()'s nested-transaction savepoint exists to
    # prevent, so that proof needs a real PostgreSQL server here in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: subscriptions_test
          POSTGRES_PASSWORD: subscriptions_test
          POSTGRES_DB: subscriptions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # See README "Testing against PostgreSQL" -- all three must be set for
      # PostgresSavepointTest to run instead of skipping itself.
      SUBSCRIPTIONS_TEST_PG_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=subscriptions_test"
      SUBSCRIPTIONS_TEST_PG_USER: subscriptions_test
      SUBSCRIPTIONS_TEST_PG_PASS: subscriptions_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, pdo_pgsql, json, mbstring
          coverage: none

      - name: Locate Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit (full suite -- includes the PostgreSQL savepoint proof)
        run: vendor/bin/phpunit

      - name: Assert the PostgreSQL savepoint proof actually executed
        # PostgresSavepointTest::setUp() calls markTestSkipped() whenever the
        # SUBSCRIPTIONS_TEST_PG_* env vars aren't wired, so the run above would
        # stay green even if this job silently stopped exercising it (e.g. the
        # service was removed, or the env vars were dropped). --fail-on-skipped
        # (PHPUnit 10.3+; this repo pins ^10.5, see phpunit.xml) turns a
        # skipped test into a non-zero exit code, so THIS step fails the build
        # unless the proof ran for real against the postgres service above.
        run: vendor/bin/phpunit --filter PostgresSavepoint --fail-on-skipped

      - name: PHPStan
        run: composer analyze

      - name: PHPCS (PSR-12)
        run: composer phpcs
